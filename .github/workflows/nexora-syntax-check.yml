name: Validate NEXORA code
on:
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check backend and admin JavaScript syntax
        run: |
          node --check server/index.js
          node --check server/smmcoder.js
          node --check admin.js
