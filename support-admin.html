<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08091a"><title>Support Center — NEXORA SMM</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/support-admin.css?v=3"><link rel="stylesheet" href="/ui-icons.css?v=button-icons-20261121-3"></head>
